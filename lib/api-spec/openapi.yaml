openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Business Assistant Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: calendar
    description: Calendar events
  - name: notifications
    description: Important notifications
  - name: mail
    description: Mail list
  - name: orders
    description: Order management
  - name: stock
    description: Stock control
  - name: contacts
    description: Employee and wholesaler contacts
  - name: notes
    description: Personal notes
  - name: webhook
    description: n8n webhook endpoints
  - name: settings
    description: App settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with business name and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: List calendar events
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /calendar/events/{id}:
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      summary: Delete a calendar event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List important notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /mail:
    get:
      operationId: listMails
      tags: [mail]
      summary: List emails
      responses:
        "200":
          description: List of emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mail"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/summary:
    get:
      operationId: getOrderSummary
      tags: [orders]
      summary: Get order counts by status
      responses:
        "200":
          description: Order summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"

  /stock:
    get:
      operationId: listStockItems
      tags: [stock]
      summary: List stock items
      responses:
        "200":
          description: List of stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"

  /stock/critical:
    get:
      operationId: listCriticalStock
      tags: [stock]
      summary: List critically low stock items
      responses:
        "200":
          description: Critical stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List personal notes
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /webhook/n8n:
    post:
      operationId: receiveN8nWebhook
      tags: [webhook]
      summary: Receive data from n8n (calendar events or alerts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/N8nWebhookPayload"
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /settings/webhook:
    get:
      operationId: getWebhookSettings
      tags: [settings]
      summary: Get n8n webhook configuration
      responses:
        "200":
          description: Webhook settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSettings"
    patch:
      operationId: updateWebhookSettings
      tags: [settings]
      summary: Update n8n webhook configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSettings"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [health]
      summary: Get aggregated dashboard metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    LoginInput:
      type: object
      required: [businessName, password]
      properties:
        businessName:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [success, businessName]
      properties:
        success:
          type: boolean
        businessName:
          type: string
        token:
          type: ["string", "null"]

    CalendarEvent:
      type: object
      required: [id, title, date, type]
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
        time:
          type: ["string", "null"]
        type:
          type: string
          enum: [wholesaler, meeting, delivery, note, other]
        description:
          type: ["string", "null"]

    CalendarEventInput:
      type: object
      required: [title, date, type]
      properties:
        title:
          type: string
        date:
          type: string
        time:
          type: ["string", "null"]
        type:
          type: string
          enum: [wholesaler, meeting, delivery, note, other]
        description:
          type: ["string", "null"]

    Notification:
      type: object
      required: [id, title, message, severity, isRead, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        isRead:
          type: boolean
        source:
          type: ["string", "null"]
        createdAt:
          type: string

    Mail:
      type: object
      required: [id, from, subject, category, receivedAt, isRead]
      properties:
        id:
          type: integer
        from:
          type: string
        subject:
          type: string
        category:
          type: string
          enum: [invoice, wholesaler, complaint, important, other]
        receivedAt:
          type: string
        isRead:
          type: boolean
        aiSummary:
          type: ["string", "null"]
        preview:
          type: ["string", "null"]

    Order:
      type: object
      required: [id, customerName, channel, status, items, total, createdAt]
      properties:
        id:
          type: integer
        customerName:
          type: string
        channel:
          type: string
          enum: [whatsapp, phone, web, other]
        status:
          type: string
          enum: [pending, preparing, delivered, cancelled]
        items:
          type: string
        total:
          type: number
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [customerName, channel, items, total]
      properties:
        customerName:
          type: string
        channel:
          type: string
          enum: [whatsapp, phone, web, other]
        items:
          type: string
        total:
          type: number

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, preparing, delivered, cancelled]

    OrderSummary:
      type: object
      required: [pending, preparing, delivered, cancelled, total]
      properties:
        pending:
          type: integer
        preparing:
          type: integer
        delivered:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer

    StockItem:
      type: object
      required: [id, name, currentStock, minStock, unit, wholesaler]
      properties:
        id:
          type: integer
        name:
          type: string
        currentStock:
          type: number
        minStock:
          type: number
        unit:
          type: string
        wholesaler:
          type: string
        weeklyOrderQty:
          type: ["number", "null"]
        isCritical:
          type: boolean

    Contact:
      type: object
      required: [id, name, role, phone, type]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        type:
          type: string
          enum: [employee, wholesaler]
        notes:
          type: ["string", "null"]

    ContactInput:
      type: object
      required: [name, role, phone, type]
      properties:
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        type:
          type: string
          enum: [employee, wholesaler]
        notes:
          type: ["string", "null"]

    Note:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: integer
        content:
          type: string
        tag:
          type: ["string", "null"]
        isPinned:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    NoteInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        tag:
          type: ["string", "null"]
        isPinned:
          type: boolean

    NoteUpdate:
      type: object
      properties:
        content:
          type: string
        tag:
          type: ["string", "null"]
        isPinned:
          type: boolean

    N8nWebhookPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [calendar_event, notification, order]
        data:
          type: object

    WebhookSettings:
      type: object
      required: [id, webhookUrl, secretToken, isActive]
      properties:
        id:
          type: integer
        webhookUrl:
          type: string
        secretToken:
          type: ["string", "null"]
        isActive:
          type: boolean
        lastTriggeredAt:
          type: ["string", "null"]

    WebhookSettingsUpdate:
      type: object
      properties:
        isActive:
          type: boolean
        secretToken:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required: [totalOrders, pendingOrders, criticalStockCount, unreadNotifications, unreadMails]
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        criticalStockCount:
          type: integer
        unreadNotifications:
          type: integer
        unreadMails:
          type: integer
